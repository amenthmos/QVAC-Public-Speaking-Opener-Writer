<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Public Speaking Opener Writer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1b1f2a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eef1f8;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 540px; }
  .card {
    background: #242938;
    border-radius: 14px;
    border: 1px solid #34394a;
    padding: 34px 36px;
  }
  .brand { font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: #f2b544; font-weight: 700; margin-bottom: 6px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #fff; font-weight: 800; }
  .subtitle { color: #9aa2b8; font-size: 0.9rem; margin-bottom: 26px; }
  .field-label { font-size: 0.78rem; color: #9aa2b8; margin-bottom: 6px; font-weight: 600; }
  input[type=text] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid #3d4356;
    background: #1b1f2a;
    color: #eef1f8;
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  input[type=text]:focus { outline: none; border-color: #f2b544; }
  button.action {
    padding: 11px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    background: #f2b544;
    color: #1b1f2a;
  }
  button.action:hover:not(:disabled) { background: #d99f30; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #7a8299; min-height: 1.2em; }
  .result-box {
    margin-top: 22px;
    padding: 20px 22px;
    background: #1b1f2a;
    border-left: 3px solid #f2b544;
    border-radius: 6px;
    font-size: 1.15rem;
    line-height: 1.6;
    color: #fff;
    font-style: italic;
  }
  .footer-note { color: #7a8299; font-size: 0.78rem; text-align: center; margin-top: 22px; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #3d4356;
    border-top-color: #f2b544;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">On-Device Speech Coach</div>
      <h1>Public Speaking Opener Writer</h1>
      <p class="subtitle">Enter your talk's topic and audience, get a strong opening hook line.</p>

      <div class="field-label">TALK TOPIC</div>
      <input type="text" id="topicInput" placeholder="e.g. why most startups fail at pricing" />
      <div class="field-label">AUDIENCE</div>
      <input type="text" id="audienceInput" placeholder="e.g. early-stage founders" />
      <button class="action" id="generateBtn">Write Opener</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const topicInput = document.getElementById('topicInput');
    const audienceInput = document.getElementById('audienceInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const topic = topicInput.value.trim();
      const audience = audienceInput.value.trim();
      if (!topic || !audience) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Crafting your hook...';

      try {
        const res = await fetch('/api/opener', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic, audience }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-box">${escapeHtml(data.opener)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    audienceInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
